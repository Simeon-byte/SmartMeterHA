name: SmartmeterHA
version: "1.0.0"
slug: smartmeter
description: Read encrypted VKW smart meter telegrams and publish Home Assistant MQTT sensors
url: https://github.com/simeon/SmartmeterHA
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
init: true
uart: true
services:
  - mqtt:need
options:
  key: null
  comport: /dev/ttyUSB0
  device_name: SmartMeterVKW
  log_level: 1
schema:
  key: password
  comport: device(subsystem=tty)
  device_name: str
  log_level: int(0,2)
stage: experimental
